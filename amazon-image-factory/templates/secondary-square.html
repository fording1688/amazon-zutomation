<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      * { box-sizing: border-box; }
      body {
        width: 1500px;
        height: 1500px;
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        color: #17212b;
        background: #ffffff;
      }
      .canvas {
        width: 100%;
        height: 100%;
        display: grid;
        grid-template-columns: 0.95fr 1.05fr;
        gap: 64px;
        padding: 96px;
      }
      .visual {
        border: 3px solid #d7dde3;
        display: grid;
        place-items: center;
        background: #fff;
      }
      .visual img {
        max-width: 88%;
        max-height: 88%;
        object-fit: contain;
      }
      .copy {
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 30px;
      }
      h1 {
        margin: 0;
        font-size: 72px;
        line-height: 1.05;
        letter-spacing: 0;
      }
      p {
        margin: 0;
        color: #586174;
        font-size: 34px;
        line-height: 1.3;
      }
      ul {
        display: grid;
        gap: 22px;
        margin: 10px 0 0;
        padding: 0;
        list-style: none;
      }
      li {
        position: relative;
        padding-left: 38px;
        font-size: 34px;
        line-height: 1.25;
      }
      li::before {
        content: "";
        position: absolute;
        left: 0;
        top: 13px;
        width: 18px;
        height: 18px;
        border-radius: 99px;
        background: #246a5f;
      }
      .brand {
        margin-top: 28px;
        padding-top: 24px;
        border-top: 3px solid #d7dde3;
        color: #246a5f;
        font-size: 28px;
        font-weight: 800;
      }
    </style>
  </head>
  <body>
    <main class="canvas">
      <section class="visual">
        <img src="{{PRODUCT_IMAGE_URL}}" alt="{{PRODUCT_NAME}}" />
      </section>
      <section class="copy">
        <h1>{{HEADLINE}}</h1>
        <p>{{SUBTITLE}}</p>
        <ul>
          <li>{{BULLET_1}}</li>
          <li>{{BULLET_2}}</li>
          <li>{{BULLET_3}}</li>
        </ul>
        <div class="brand">{{BRAND}}</div>
      </section>
    </main>
  </body>
</html>
