<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      * { box-sizing: border-box; }
      body {
        width: 1500px;
        height: 1500px;
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        color: #17212b;
        background: #f7f8f8;
      }
      .module {
        width: 100%;
        height: 100%;
        display: grid;
        grid-template-rows: auto 1fr;
        gap: 54px;
        padding: 88px 96px;
      }
      header {
        display: grid;
        gap: 16px;
        max-width: 1080px;
      }
      .eyebrow {
        color: #246a5f;
        font-size: 26px;
        font-weight: 900;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }
      h1 {
        margin: 0;
        font-size: 78px;
        line-height: 1.02;
      }
      .body {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 56px;
        align-items: center;
      }
      .media {
        height: 760px;
        display: grid;
        place-items: center;
        background: #fff;
        border: 3px solid #d9dee4;
      }
      .media img {
        max-width: 86%;
        max-height: 86%;
        object-fit: contain;
      }
      .points {
        display: grid;
        gap: 24px;
      }
      .point {
        padding: 28px;
        background: #fff;
        border-left: 10px solid #246a5f;
        font-size: 34px;
        line-height: 1.28;
      }
    </style>
  </head>
  <body>
    <main class="module">
      <header>
        <div class="eyebrow">{{BRAND}}</div>
        <h1>{{HEADLINE}}</h1>
      </header>
      <section class="body">
        <div class="media"><img src="{{PRODUCT_IMAGE_URL}}" alt="{{PRODUCT_NAME}}" /></div>
        <div class="points">
          <div class="point">{{POINT_1}}</div>
          <div class="point">{{POINT_2}}</div>
          <div class="point">{{POINT_3}}</div>
        </div>
      </section>
    </main>
  </body>
</html>
