<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --ink: #111827;
        --muted: #4b5563;
        --line: #d1d5db;
        --accent: #0f766e;
        --bg: #ffffff;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        width: 2000px;
        height: 2000px;
        font-family: Arial, Helvetica, sans-serif;
        color: var(--ink);
        background: var(--bg);
      }

      .canvas {
        width: 100%;
        height: 100%;
        display: grid;
        grid-template-columns: 1.05fr 0.95fr;
        gap: 72px;
        padding: 130px;
      }

      .product {
        display: grid;
        place-items: center;
        border: 3px solid var(--line);
        background: #fff;
      }

      .product img {
        max-width: 86%;
        max-height: 86%;
        object-fit: contain;
      }

      .copy {
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 42px;
      }

      h1 {
        margin: 0;
        font-size: 88px;
        line-height: 1.05;
        letter-spacing: 0;
      }

      .subtitle {
        margin: 0;
        color: var(--muted);
        font-size: 42px;
        line-height: 1.28;
      }

      .feature-list {
        display: grid;
        gap: 28px;
        margin-top: 12px;
      }

      .feature {
        display: grid;
        grid-template-columns: 34px 1fr;
        gap: 22px;
        align-items: start;
        font-size: 39px;
        line-height: 1.22;
      }

      .dot {
        width: 24px;
        height: 24px;
        margin-top: 11px;
        border-radius: 999px;
        background: var(--accent);
      }

      .footer {
        margin-top: 24px;
        padding-top: 30px;
        border-top: 3px solid var(--line);
        color: var(--muted);
        font-size: 32px;
        line-height: 1.25;
      }
    </style>
  </head>
  <body>
    <main class="canvas">
      <section class="product">
        <img src="{{PRODUCT_IMAGE_URL}}" alt="{{PRODUCT_NAME}}" />
      </section>
      <section class="copy">
        <div>
          <h1>{{HEADLINE}}</h1>
          <p class="subtitle">{{SUBTITLE}}</p>
        </div>
        <div class="feature-list">
          <div class="feature"><span class="dot"></span><span>{{BULLET_1}}</span></div>
          <div class="feature"><span class="dot"></span><span>{{BULLET_2}}</span></div>
          <div class="feature"><span class="dot"></span><span>{{BULLET_3}}</span></div>
        </div>
        <div class="footer">{{FOOTER_NOTE}}</div>
      </section>
    </main>
  </body>
</html>
